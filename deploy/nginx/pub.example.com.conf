# vhost for anypub on the existing nginx, reusing the wildcard certificate.
# nginx does not inherit add_header into a location that sets its own, so
# the shared headers live in anypub-headers.conf and are included per location.

server {
    listen 443 ssl;
    http2 on;
    server_name pub.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /srv/anypub/public;
    autoindex off;
    # p/<slug> is a symlink into .v/; symlinks must be followed (nginx default)
    disable_symlinks off;

    # assets carry their content hash in the name: cache them long
    location ~ ^/p/[A-Za-z0-9_-]+/a/[0-9a-f]{64}\.[a-z0-9]+$ {
        include /etc/nginx/snippets/anypub-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # pages: always revalidate so an unpublished page disappears at once
    location ~ ^/p/[A-Za-z0-9_-]+/?$ {
        include /etc/nginx/snippets/anypub-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri/index.html =404;
    }

    # everything else, including .v/ and tmp/, is not served
    location / { return 404; }
}

server {
    listen 80;
    server_name pub.example.com;
    return 301 https://$host$request_uri;
}
